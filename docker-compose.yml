services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dismean
      POSTGRES_PASSWORD: dismean
      POSTGRES_DB: dismean
    ports:
      - "5432:5432"
    volumes:
      - dismean-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dismean -d dismean"]
      interval: 2s
      timeout: 5s
      retries: 15

  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - dismean-rabbit:/var/lib/rabbitmq
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmqctl", "await_startup"]
      interval: 3s
      timeout: 10s
      retries: 20

volumes:
  dismean-pg:
  dismean-rabbit:
